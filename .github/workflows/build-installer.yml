# 설치 파일(Setup.exe)을 GitHub이 대신 빌드한다.
#
# 이걸 두는 이유: 설치본을 만들려면 Node·Python·PyInstaller가 모두 갖춰진
# Windows 환경이 필요한데, 팀원 각자가 그 환경을 맞추는 건 비용이다.
# GitHub의 Windows 러너가 매번 깨끗한 환경에서 빌드해 결과물만 올려 주면
# **아무도 빌드 도구를 설치하지 않아도** 설치 파일을 받을 수 있다.
#
# 받는 법: GitHub 저장소 → Actions 탭 → 이 워크플로 실행 결과 →
#          Artifacts의 `LocalFileAI-Setup` 다운로드 → 압축 풀고 Setup.exe 실행
#
# 앱 사용자는 이 파일과 무관하다 — 사용자는 Setup.exe만 있으면 된다.

name: 설치 파일 빌드 (Windows)

on:
  # Actions 탭에서 버튼으로 직접 실행
  workflow_dispatch:
  # 코드가 바뀌면 자동으로 — 문서·홈페이지만 고친 커밋은 건너뛴다
  push:
    branches:
      - claude/be1-week-3-tasks-peajyw
      - main
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**.md'
    # v0.1.0 같은 태그를 밀면 릴리스로 공개한다 (홈페이지 다운로드 버튼의 대상)
    tags:
      - 'v*'
  # 웹 UI에서 릴리스를 만들어도 빌드해서 설치 파일을 붙인다 —
  # 터미널 없이 배포하려면 이 경로가 필요하다.
  release:
    types: [published]

permissions:
  contents: write   # 릴리스 생성에 필요

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # 로컬에서 Node 16으로 겪은 빌드 실패를 원천 차단한다 (package.json engines와 동일)
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # --- 백엔드를 실행 파일 하나로 (server.exe) ---
      - name: 파이썬 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: 백엔드 테스트
        working-directory: backend
        run: python -m pytest tests -q

      - name: server.exe 빌드
        working-directory: backend
        run: pyinstaller server.spec --noconfirm

      # --- 문서 분석 도구(실행기) 동봉 ---
      # 사용자 PC에서 첫 실행 때 1.4GB를 내려받게 했더니, 어떤 네트워크에서는
      # 다운로드가 반복적으로 깨졌다(중간 장비의 개입으로 추정 — 같은 PC에서
      # 서로 다른 지점의 손상이 두 번). 사용자 네트워크는 우리가 통제할 수
      # 없는 변수다. GitHub 러너의 안정된 네트워크에서 받아 설치본에 동봉하면
      # 첫 실행에 실행기 다운로드가 아예 없어진다 — 이 실패 계급 전체가
      # 사라진다. 설치본이 커지는 것(±700MB)은 그 대가로 받아들인다.
      - name: 문서 분석 도구(실행기) 동봉 준비
        shell: pwsh
        run: |
          $url = "https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile ollama.zip -MaximumRetryCount 3 -RetryIntervalSec 10
          New-Item -ItemType Directory -Force ollama-runtime | Out-Null
          tar -xf ollama.zip -C ollama-runtime
          Remove-Item ollama.zip
          if (!(Test-Path "ollama-runtime/ollama.exe")) { throw "ollama.exe가 없습니다 — zip 구조가 바뀌었는지 확인 필요" }
          Get-ChildItem ollama-runtime | Select-Object Name, Length

      # --- 프론트 + 설치본 ---
      - name: Node 의존성 설치
        run: npm ci

      - name: 프론트 빌드
        run: npm run build

      - name: 설치본 빌드
        run: npx electron-builder --win --publish never

      # 핵심 내용물이 실제로 들어갔는지 확인한다. 동봉이 조용히 빠지면
      # (extraResources 경로 오타 등) 사용자는 설치 후에야 알게 된다 —
      # 그 실수는 여기서 빌드 실패로 잡는다.
      #
      # 설치본(.exe)을 도로 여는 방식은 쓰지 않는다: 7z가 최신 NSIS 형식을
      # 못 열어 "내용물 없음"으로 오판했고, 멀쩡한 1.4GB 빌드를 실패시켰다.
      # NSIS는 win-unpacked/ 폴더를 그대로 포장하므로, 포장 직전의 그 폴더를
      # 확인하는 것이 같은 사실을 오판 여지 없이 증명한다.
      - name: 설치본 내용 검증 (백엔드·실행기 동봉 확인)
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/*.exe | Select-Object -First 1
          "설치본: $($setup.Name) ($([math]::Round($setup.Length/1MB))MB)"
          $resources = "release/win-unpacked/resources"
          foreach ($required in @("$resources/backend/server.exe",
                                  "$resources/ollama/ollama.exe")) {
            if (!(Test-Path $required)) { throw "동봉 누락: $required" }
            $size = [math]::Round((Get-Item $required).Length/1MB)
            "포함 확인: $required (${size}MB)"
          }
          $ollamaCount = (Get-ChildItem "$resources/ollama" -Recurse -File).Count
          "실행기 파일 수: $ollamaCount"
          if ($ollamaCount -lt 5) { throw "실행기 구성 파일이 너무 적습니다 ($ollamaCount)" }

      # 팀 내부 확인용 — 로그인한 사람만 받을 수 있다
      - name: 설치 파일 업로드 (아티팩트)
        uses: actions/upload-artifact@v5
        with:
          name: LocalFileAI-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      # 일반 사용자 배포용 — 태그·릴리스일 때만. 로그인 없이 받을 수 있는 유일한 경로다.
      - name: 릴리스에 설치 파일 첨부
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
